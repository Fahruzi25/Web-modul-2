# ============================================================================
# SuryaLog Cloud -- Multi-Container Compose Stack (Module 2)
# 5 Services: api, worker, db (Postgres), cache (Redis), web (Nginx)
# ============================================================================

name: suryalog

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: suryalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: suryalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sample-readings.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suryalog"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - suryalog_net

  cache:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    container_name: suryalog-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - suryalog_net

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: suryalog/api:v1.0.0
    container_name: suryalog-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: suryalog
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: cache
      REDIS_PORT: 6379
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - suryalog_net

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: suryalog/worker:v1.0.0
    container_name: suryalog-worker
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: suryalog
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: cache
      REDIS_PORT: 6379
      WORKER_INTERVAL_SEC: 15
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - suryalog_net

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: suryalog/web:v1.0.0
    container_name: suryalog-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - suryalog_net

volumes:
  db_data:
    name: suryalog_db_data

networks:
  suryalog_net:
    name: suryalog_net
